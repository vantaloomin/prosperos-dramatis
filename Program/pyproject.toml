[project]
name = "prospero-dramatis"
version = "0.2.0"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.12,<3",
                "keyring>=25.7,<26", "pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["dramatis*"]

[tool.setuptools.package-data]
dramatis = ["prompts/*.md", "prompts/*.json", "data/*.json", "formats/SOURCE.json", "formats/*/data/*.json",
            "formats/companion/images/workflows/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["dramatis/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
# Vendored as each app wrote it; each app's own CI lints it.
extend-exclude = ["dramatis/formats/companion", "dramatis/formats/adventure", "dramatis/formats/dungeon"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
