name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The daily format sync (sync-formats.yml) starts CI on its own pull request this way, since a pull request a
  # workflow opens does not start other workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: Program

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Program/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  formats:
    # The vendored files must be exactly what each app had at the commit SOURCE.json records, so nobody edits them
    # here by hand. An app's main moving on is not this job's business: the daily sync (sync-formats.yml) brings it
    # in as its own pull request, so drift never turns an unrelated pull request red.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pins
        name: Read the recorded commits
        run: jq -r 'to_entries[] | "\(.key)=\(.value.commit)"' dramatis/formats/SOURCE.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: vantaloomin/prosperos-companion
          ref: ${{ steps.pins.outputs.companion }}
          path: companion
          persist-credentials: false
          sparse-checkout: Program/companion
      - uses: actions/checkout@v4
        with:
          repository: vantaloomin/prosperos-adventure
          ref: ${{ steps.pins.outputs.adventure }}
          path: adventure
          persist-credentials: false
          sparse-checkout: Program/adventure
      - uses: actions/checkout@v4
        with:
          repository: vantaloomin/prosperos-dungeon
          ref: ${{ steps.pins.outputs.dungeon }}
          path: dungeon
          persist-credentials: false
          sparse-checkout: Program/dungeon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_format.py --companion ../companion --adventure ../adventure --dungeon ../dungeon --check
